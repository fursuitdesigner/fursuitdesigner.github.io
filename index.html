<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>獸裝設計師 | Furry Suit Designer</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #4f46e5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    aside {
      width: 340px;
      min-width: 300px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .scroll { flex: 1; overflow-y: auto; padding: 18px; }
    h1 { font-size: 1.25rem; margin: 0 0 4px; }
    .sub { font-size: 0.8rem; color: var(--muted); margin-bottom: 18px; }
    h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin: 18px 0 10px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }
    .control-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 5px; }
    input[type="text"], input[type="number"], select {
      width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.85rem;
    }
    .region { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); }
    .region:last-child { border-bottom: none; }
    .region-name { flex: 1; font-size: 0.85rem; }
    input[type="color"] { width: 36px; height: 28px; border: none; background: none; cursor: pointer; padding: 0; }
    select.pattern { width: 100px; font-size: 0.78rem; }
    .slider-row { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
    .slider-row label { width: 90px; margin: 0; flex-shrink: 0; }
    input[type="range"] { flex: 1; }
    input[type="number"].val { width: 60px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.8rem; text-align: right; color: var(--text); }
    .actions { padding: 14px 18px; border-top: 1px solid var(--border); background: #fafafa; display: flex; gap: 10px; flex-wrap: wrap; }
    #btn-default { flex: 1 1 100%; }
    button {
      flex: 1; padding: 10px 12px; border: none; border-radius: 6px;
      background: var(--accent); color: #fff; font-size: 0.85rem; cursor: pointer; transition: opacity 0.15s;
    }
    button:hover { opacity: 0.9; }
    button.secondary { background: #fff; color: var(--text); border: 1px solid var(--border); }
    main { flex: 1; display: flex; align-items: center; justify-content: center; overflow: auto; padding: 24px; position: relative; }
    .topbar { position: absolute; top: 16px; right: 28px; z-index: 5; display: flex; gap: 8px; }
    .topbar button { flex: none; padding: 9px 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.18); }
    .modal { position: fixed; inset: 0; background: rgba(17,24,39,0.55); display: flex; align-items: center; justify-content: center; z-index: 50; }
    .modal.hidden, .toast.hidden { display: none; }
    .modal-box { background: #fff; border-radius: 10px; padding: 18px; width: min(600px, 92vw); box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .modal-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 10px; }
    #link-out { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.78rem; }
    .warn { background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412; padding: 8px 10px; border-radius: 6px; font-size: 0.78rem; line-height: 1.45; }
    .modal-actions { display: flex; gap: 10px; margin-top: 12px; }
    .toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 0.85rem; z-index: 60; }
    #sheet { background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,0.12); max-width: 100%; max-height: 100%; }
    .hint { font-size: 0.75rem; color: var(--muted); margin-top: 6px; line-height: 1.4; }
    @media print {
      aside, .actions, .topbar, .modal, .toast { display: none; }
      main { padding: 0; }
      #sheet { box-shadow: none; }
    }
  </style>
</head>
<body>
  <aside>
    <div class="scroll">
      <h1>獸裝設計師</h1>
      <div class="sub">Furry Suit Reference Sheet Designer</div>

      <h2>資料欄位</h2>
      <div class="control-group">
        <label>標題 Title</label>
        <input type="text" id="input-title" value="FULL FURRY SUIT DESIGN - MALE" />
      </div>
      <div class="control-group">
        <label>型號 Model</label>
        <input type="text" id="input-model" value="PURPLE/GREY STRIPE" />
      </div>
      <div class="control-group">
        <label>日期 Date</label>
        <input type="text" id="input-date" value="" />
      </div>

      <h2>顏色分區 COLOUR SECTIONS</h2>
      <div id="region-list"></div>
      <p class="hint">共 17 個分區，對應圖紙左下角的色塊圖例；每區可獨立選色與花紋。尾巴拆成尾根／尾中／尾尖三區；內耳與尾尖互不連動。線稿 100% 來自你的參考圖。</p>

      <h2>比例調整</h2>
      <div id="proportion-list"></div>
      <p class="hint">拉動滑桿或直接輸入數字（單位 cm）都會即時更新圖紙上的尺寸標註；數字超出範圍會自動修正回上下限。滑桿可改變頭／軀幹／手臂／腿／尾巴的長度。</p>
    </div>

    <div class="actions">
      <button id="btn-default" class="secondary">預設配色（全白）Default: white</button>
      <button id="btn-reference" class="secondary">參考配色 Reference</button>
      <button id="btn-random" class="secondary">隨機配色</button>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <button id="btn-save">儲存並複製連結 Save &amp; copy link</button>
    </div>
    <canvas id="sheet" width="1140" height="1020"></canvas>
  </main>

  <div id="link-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-title">你的作品連結 Your design link</div>
      <p id="link-warn" class="warn hidden"></p>
      <input type="text" id="link-out" readonly />
      <div class="modal-actions">
        <button id="link-copy">複製 Copy</button>
        <button id="link-open" class="secondary">開啟 Open</button>
        <button id="link-close" class="secondary">關閉 Close</button>
      </div>
      <p class="hint" id="link-note"></p>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>

        im.src = src;
      });
    }

    const viewData = {}; // view -> { w, h, linesImg, regionAlpha: {rid: canvas} }

    function decodeRegions(view, img, w, h) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const cctx = c.getContext('2d');
      cctx.drawImage(img, 0, 0);
      const data = cctx.getImageData(0, 0, w, h);
      const out = {};
      const has = {};
      for (let rid = 1; rid <= 17; rid++) {
        const rc = document.createElement('canvas');
        rc.width = w; rc.height = h;
        const rctx = rc.getContext('2d');
        const im = rctx.createImageData(w, h);
        let any = false;
        for (let i = 0; i < w * h; i++) {
          if (data.data[i * 4] === rid && data.data[i * 4 + 3] > 0) {
            im.data[i * 4] = 255; im.data[i * 4 + 1] = 255; im.data[i * 4 + 2] = 255;
            im.data[i * 4 + 3] = data.data[i * 4 + 3];
            any = true;
          }
        }
        rctx.putImageData(im, 0, 0);
        out[rid] = rc;
        has[rid] = any;
      }
      return { alpha: out, has };
    }

    /* ================= colours & patterns ================= */
    function adjustColor(hex, amount) {
      const num = parseInt(hex.replace('#', ''), 16);
      const cl = v => Math.max(0, Math.min(255, v));
      const r = cl((num >> 16) + amount), g = cl(((num >> 8) & 0xFF) + amount), b = cl((num & 0xFF) + amount);
      return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }

    function hexToRgb(hex) {
      const n = parseInt(hex.replace('#', ''), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function smoothstep(a, b, t) {
      const x = clamp((t - a) / (b - a), 0, 1);
      return x * x * (3 - 2 * x);
    }
    function hash(x, y) {
      let n = Math.sin((x + 0.5) * 12.9898 + (y + 0.5) * 78.233) * 43758.5453123;
      return n - Math.floor(n);
    }
    function valueNoise(x, y, period) {
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = smoothstep(0, 1, x - ix), fy = smoothstep(0, 1, y - iy);
      const x0 = ((ix % period) + period) % period;
      const y0 = ((iy % period) + period) % period;
      const x1 = (x0 + 1) % period;
      const y1 = (y0 + 1) % period;
      const a = (1 - fx) * hash(x0, y0) + fx * hash(x1, y0);
      const b = (1 - fx) * hash(x0, y1) + fx * hash(x1, y1);
      return (1 - fy) * a + fy * b;
    }
    function fbm(x, y, octaves, period) {
      let total = 0, amp = 1, freq = 1, max = 0;
      for (let i = 0; i < octaves; i++) {
        total += valueNoise(x * freq, y * freq, period) * amp;
        max += amp;
        amp *= 0.5;
        freq *= 2;
      }
      return total / max;
    }
    function cellular(x, y, density, seed, period) {
      const cells = period / density;
      const ix = Math.floor(x / density), iy = Math.floor(y / density);
      let f1 = 99, f2 = 99;
      for (let i = -1; i <= 1; i++) {
        for (let j = -1; j <= 1; j++) {
          let cx = ix + i, cy = iy + j;
          cx = ((cx % cells) + cells) % cells;
          cy = ((cy % cells) + cells) % cells;
          const px = (cx + hash(cx * 3.1 + seed, cy * 7.3 + seed)) * density;
          const py = (cy + hash(cx * 5.7 + seed, cy * 2.9 + seed)) * density;
          const dx = Math.abs(x - px), dy = Math.abs(y - py);
          const d = Math.sqrt(dx * dx + dy * dy);
          if (d < f1) { f2 = f1; f1 = d; }
          else if (d < f2) f2 = d;
        }
      }
      return { f1, f2 };
    }
    function furGrain(ctx, w, h, color, density) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.10;
      ctx.lineWidth = 0.5;
      const step = 4;
      for (let y = 0; y < h; y += step) {
        for (let x = 0; x < w; x += step) {
          const h1 = hash(x, y);
          if (h1 > density) continue;
          const h2 = hash(x + 31, y + 17);
          const h3 = hash(x + 53, y + 7);
          const px = x + h2 * step;
          const py = y + h3 * step;
          const ang = (h2 - 0.5) * 0.8 + Math.PI / 2;
          const len = 2 + h3 * 4;
          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(px + Math.cos(ang) * len, py + Math.sin(ang) * len);
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    function patternTile(ridKey) {
      const { color, pattern } = state[ridKey];
      const W = 128, H = 128;
      const t = document.createElement('canvas');
      t.width = W; t.height = H;
      const tc = t.getContext('2d');

      tc.fillStyle = color;
      tc.fillRect(0, 0, W, H);
      if (pattern === 'solid') return t;

      const [baseR, baseG, baseB] = hexToRgb(color);
      const dark = hexToRgb(adjustColor(color, -55));
      const light = hexToRgb(adjustColor(color, 45));

      const img = tc.getImageData(0, 0, W, H);
      const d = img.data;

      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const n0 = fbm(x * 0.08, y * 0.08, 2, W);
          const furTint = (n0 - 0.5) * 14;
          let mask = 0, useLight = false;

          if (pattern === 'gradient') {
            const nG = fbm(x * 0.015, y * 0.015, 3, W);
            const amt = (nG - 0.5) * 64;
            const i = (y * W + x) * 4;
            d[i] = clamp(baseR + furTint + amt, 0, 255);
            d[i + 1] = clamp(baseG + furTint + amt, 0, 255);
            d[i + 2] = clamp(baseB + furTint + amt, 0, 255);
            continue;
          }

          if (pattern === 'tiger') {
            const n = fbm(x * 0.06 + y * 0.02, y * 0.07, 4, W);
            const v = Math.sin(x * (2 * Math.PI / W) * 5 + y * 0.04 + n * 3.5);
            mask = smoothstep(0.30, 0.55, v);
          } else if (pattern === 'zebra') {
            const n = fbm(x * 0.04 - y * 0.03, x * 0.04 + y * 0.04, 3, W);
            const v = Math.sin((x + y) * (2 * Math.PI / W) * 3 + n * 2.5);
            mask = smoothstep(0.15, 0.45, v);
          } else if (pattern === 'cheetah') {
            const c = cellular(x, y, 15, 1, W);
            const e = fbm(x * 0.25, y * 0.25, 2, W);
            const rr = 3.6 + (e - 0.5) * 1.6;
            mask = c.f1 < rr ? smoothstep(rr, rr - 1.6, c.f1) : 0;
          } else if (pattern === 'leopard') {
            const c = cellular(x, y, 30, 2, W);
            const e = fbm(x * 0.12, y * 0.12, 3, W);
            const r = 8 + (e - 0.5) * 5;
            const ring = Math.abs(c.f1 - r);
            let m = smoothstep(3.2, 0.8, ring);
            m *= 0.45 + 0.55 * smoothstep(0.30, 0.65, e);
            if (c.f1 < r - 3.5) m *= 0.12;
            if (c.f1 < 2.4 && e > 0.55) m = Math.max(m, 0.85);
            mask = m;
          } else if (pattern === 'dalmatian') {
            const c = cellular(x, y, 30, 3, W);
            const e = fbm(x * 0.18, y * 0.18, 2, W);
            const rr = 6.5 + (e - 0.5) * 3;
            mask = c.f1 < rr ? smoothstep(rr, rr - 2.5, c.f1) : 0;
          } else if (pattern === 'cow') {
            const n = fbm(x * 0.02, y * 0.02, 4, W);
            mask = n > 0.52 ? smoothstep(0.52, 0.62, n) : 0;
          } else if (pattern === 'fawn') {
            const c = cellular(x, y, 15, 4, W);
            const e = fbm(x * 0.30, y * 0.30, 2, W);
            const rr = 2.6 + (e - 0.5) * 1.2;
            mask = c.f1 < rr ? smoothstep(rr, rr - 1.2, c.f1) : 0;
            useLight = true;
          } else if (pattern === 'tabby') {
            const qx = fbm(x * 0.035, y * 0.035, 3, W);
            const qy = fbm(x * 0.035 + 5, y * 0.035 + 5, 3, W);
            const v = fbm(x * 0.035 + qx * 2, y * 0.035 + qy * 2, 4, W);
            mask = v > 0.55 ? smoothstep(0.55, 0.65, v) : 0;
          } else if (pattern === 'brindle') {
            const n = fbm(x * 0.07 + y * 0.02, y * 0.12, 4, W);
            const v = Math.sin(x * (2 * Math.PI / W) * 8 + y * 0.06 + n * 2);
            mask = smoothstep(0.22, 0.42, v);
          }

          mask *= 0.9;
          const mr = useLight ? light[0] : dark[0];
          const mg = useLight ? light[1] : dark[1];
          const mb = useLight ? light[2] : dark[2];
          const i = (y * W + x) * 4;
          d[i] = clamp(baseR + furTint + (mr - baseR) * mask, 0, 255);
          d[i + 1] = clamp(baseG + furTint + (mg - baseG) * mask, 0, 255);
          d[i + 2] = clamp(baseB + furTint + (mb - baseB) * mask, 0, 255);
        }
      }
      tc.putImageData(img, 0, 0);
      furGrain(tc, W, H, adjustColor(color, pattern === 'fawn' ? 30 : -30), 0.22);
      return t;
    }

    const tintCache = {};
    const tileCache = {};                 // pattern tiles are view-independent -> build once, share across views
    function tileFor(key) {
      const ck = state[key].color + '|' + state[key].pattern;
      if (!tileCache[ck]) tileCache[ck] = patternTile(key);
      return tileCache[ck];
    }
    let quickDraw = false;                // while dragging a colour picker: preview with flat colour, skip pattern maths
    function tintedLayer(view, rid) {
      const key = REGION_KEYS[rid - 1];
      const cacheKey = view + '|' + key + '|' + state[key].color + '|' + state[key].pattern + (quickDraw ? '|q' : '');
      if (tintCache[cacheKey]) return tintCache[cacheKey];
      const vd = viewData[view];
      const c = document.createElement('canvas');
      c.width = vd.w; c.height = vd.h;
      const cc = c.getContext('2d');
      if (quickDraw || state[key].pattern === 'solid') {
        cc.fillStyle = state[key].color;
        cc.fillRect(0, 0, vd.w, vd.h);
      } else {
        cc.fillStyle = cc.createPattern(tileFor(key), 'repeat');
        cc.fillRect(0, 0, vd.w, vd.h);
      }
      cc.globalCompositeOperation = 'destination-in';
      cc.drawImage(vd.regionAlpha[rid], 0, 0);
      tintCache[cacheKey] = c;
      return c;
    }
    function clearTintCache() { Object.keys(tintCache).forEach(k => delete tintCache[k]); }
    // only drop the layers of one section (a colour/pattern change can't affect the others)
    function invalidateRegion(key) {
      Object.keys(tintCache).forEach(k => { if (k.split('|')[1] === key) delete tintCache[k]; });
    }

    // coalesce bursts of input events (dragging a colour picker) into one paint per frame
    const scheduleFrame = (typeof requestAnimationFrame === 'function')
      ? cb => requestAnimationFrame(cb) : cb => setTimeout(cb, 16);
    let renderPending = false;
    function requestRender() {
      if (renderPending) return;
      renderPending = true;
      scheduleFrame(() => { renderPending = false; render(); });
    }

    /* ================= warping ================= */
    function ratios() {
      return {
        rH: proportions.head.value / bases.head,
        rT: proportions.torso.value / bases.torso,
        rA: proportions.arm.value / bases.arm,
        rL: proportions.leg.value / bases.leg,
        rTl: proportions.tail.value / bases.tail
      };
    }

    function warpFns(cfg, R) {
      const legTop = cfg.ground - (cfg.ground - cfg.hip) * R.rL;
      const torsoTop = legTop - (cfg.hip - cfg.neck) * R.rT;
      const headTop = torsoTop - cfg.neck * R.rH;
      const warp = y => {
        if (y >= cfg.hip) return legTop + (y - cfg.hip) * R.rL;
        if (y >= cfg.neck) return torsoTop + (y - cfg.neck) * R.rT;
        return headTop + y * R.rH;
      };
      const sheetY = y2 => GROUND_Y - (cfg.ground - y2) * SCALE;
      return { legTop, torsoTop, headTop, warp, sheetY };
    }

    function gridPattern() {
      const t = document.createElement('canvas');
      t.width = 20; t.height = 20;
      const tc = t.getContext('2d');
      tc.fillStyle = '#ffffff';
      tc.fillRect(0, 0, 20, 20);
      tc.strokeStyle = '#e5e7eb';
      tc.lineWidth = 0.8;
      tc.beginPath(); tc.moveTo(20, 0); tc.lineTo(0, 0); tc.lineTo(0, 20); tc.stroke();
      return ctx.createPattern(t, 'repeat');
    }
    let gridPat = null;

    /* ================= view drawing ================= */
    function drawView(view) {
      const cfg = VIEW_CFG[view];
      const vd = viewData[view];
      const R = ratios();
      const F = warpFns(cfg, R);
      const w = vd.w, h = vd.h;
      const layers = [];
      for (let rid = 1; rid <= 17; rid++) {
        if (!vd.hasRegion[rid]) continue;          // skip sections that don't exist in this view
        layers.push(tintedLayer(view, rid));
      }
      layers.push(vd.linesImg);

      const bands = [
        [0, cfg.neck, F.headTop, R.rH],
        [cfg.neck, cfg.hip, F.torsoTop, R.rT],
        [cfg.hip, cfg.ground, F.legTop, R.rL]
      ];
      for (const [y0, y1, top2, ratio] of bands) {
        const sh = y1 - y0;
        const dy = F.sheetY(top2);
        const dh = sh * ratio * SCALE;
        for (const layer of layers) {
          ctx.drawImage(layer, 0, y0, w, sh, cfg.x, dy, w * SCALE, dh);
        }
      }

      /* arm strip (front view only: arms sit outside the torso columns) */
      if (cfg.hasArm && R.rA !== 1 || (cfg.hasArm && true)) {
        const srcY0 = cfg.shoulder, srcY1 = cfg.paw;
        const destTop = F.sheetY(F.torsoTop + (srcY0 - cfg.neck) * R.rT);
        const clearBottom = F.sheetY(F.legTop + (srcY1 - cfg.hip) * R.rL);
        const strips = [[0, cfg.cx - cfg.armSplit], [cfg.cx + cfg.armSplit, w]];
        for (const [sx0, sx1] of strips) {
          const sw = sx1 - sx0;
          ctx.save();
          ctx.fillStyle = gridPat;
          ctx.fillRect(cfg.x + sx0 * SCALE, destTop - 2, sw * SCALE, clearBottom - destTop + 4);
          ctx.restore();
          const dh = (srcY1 - srcY0) * R.rA * SCALE;
          for (const layer of layers) {
            ctx.drawImage(layer, sx0, srcY0, sw, srcY1 - srcY0, cfg.x + sx0 * SCALE, destTop, sw * SCALE, dh);
          }
        }
      }

      /* tail slice (side2: big curl gets uniform scaling from the rump) */
      if (cfg.tailSplit !== undefined) {
        const sx = cfg.tailSplit, sy0 = cfg.tailTop, sy1 = cfg.tailBottom;
        const sw = w - sx, sh = sy1 - sy0;
        const clearY0 = F.sheetY(F.warp(sy0)) - 2;
        const clearY1 = F.sheetY(F.warp(sy1)) + 2;
        ctx.save();
        ctx.fillStyle = gridPat;
        ctx.fillRect(cfg.x + sx * SCALE - 2, clearY0, sw * SCALE + 4, clearY1 - clearY0);
        ctx.restore();
        const anchorY = F.sheetY(F.warp(cfg.tailAnchor));
        const dx = cfg.x + sx * SCALE;
        const dw = sw * R.rTl * SCALE;
        const dh = sh * R.rTl * SCALE;
        const dy = anchorY - (cfg.tailAnchor - sy0) * R.rTl * SCALE;
        for (const layer of layers) {
          ctx.drawImage(layer, sx, sy0, sw, sh, dx, dy, dw, dh);
        }
      }
      return F;
    }

    /* ================= annotations ================= */
    function arrow(x1, y1, x2, y2) {
      ctx.strokeStyle = '#374151';
      ctx.fillStyle = '#374151';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      const ang = Math.atan2(y2 - y1, x2 - x1);
      [[x2, y2, ang], [x1, y1, ang + Math.PI]].forEach(([px, py, a]) => {
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px - 7 * Math.cos(a - 0.5), py - 7 * Math.sin(a - 0.5));
        ctx.lineTo(px - 7 * Math.cos(a + 0.5), py - 7 * Math.sin(a + 0.5));
        ctx.closePath(); ctx.fill();
      });
    }
    function vlabel(x, y, text) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-Math.PI / 2);
      ctx.textAlign = 'center';
      ctx.fillText(text, 0, 0);
      ctx.restore();
    }

    function total() { return proportions.head.value + proportions.torso.value + proportions.leg.value; }

    function drawAnnotations(Fs) {
      const R = ratios();
      ctx.font = '11px Arial, sans-serif';
      ctx.fillStyle = '#374151';
      const front = VIEW_CFG.front;
      const fw = viewData.front.w * SCALE;
      const F = Fs.front;

      // total height
      arrow(front.x - 45, F.sheetY(F.headTop), front.x - 45, GROUND_Y);
      vlabel(front.x - 53, (F.sheetY(F.headTop) + GROUND_Y) / 2, `TOTAL HEIGHT: ${total()} CM`);
      // torso
      arrow(front.x - 28, F.sheetY(F.torsoTop), front.x - 28, F.sheetY(F.legTop));
      vlabel(front.x - 36, (F.sheetY(F.torsoTop) + F.sheetY(F.legTop)) / 2, `TORSO LENGTH: ${proportions.torso.value} CM`);
      // leg
      arrow(front.x - 11, F.sheetY(F.legTop), front.x - 11, GROUND_Y);
      vlabel(front.x - 19, (F.sheetY(F.legTop) + GROUND_Y) / 2, `LEG LENGTH: ${proportions.leg.value} CM`);
      // head (right side)
      const hx = front.x + fw + 12;
      arrow(hx, F.sheetY(F.headTop), hx, F.sheetY(F.torsoTop));
      ctx.textAlign = 'left';
      ctx.fillText(`HEAD HEIGHT: ${proportions.head.value} CM`, hx + 6, (F.sheetY(F.headTop) + F.sheetY(F.torsoTop)) / 2);
      // arm (right side)
      const armTop = F.sheetY(F.torsoTop + (front.shoulder - front.neck) * R.rT);
      const armH = (front.paw - front.shoulder) * R.rA * SCALE;
      arrow(hx, armTop, hx, armTop + armH);
      ctx.fillText(`ARM LENGTH: ${proportions.arm.value} CM`, hx + 6, armTop + armH / 2);

      // material note
      ctx.font = '9px Arial, sans-serif';
      ctx.fillText('FAUX FUR MATERIALS', front.x + fw + 6, F.sheetY(F.headTop) - 22);
      ctx.fillText('AND FEVER PADDING', front.x + fw + 6, F.sheetY(F.headTop) - 12);
      ctx.beginPath();
      ctx.moveTo(front.x + fw + 4, F.sheetY(F.headTop) - 18);
      ctx.lineTo(front.x + fw - 20, F.sheetY(F.headTop) + 6);
      ctx.stroke();
      ctx.font = '11px Arial, sans-serif';

      // tail length (side2)
      const cfg = VIEW_CFG.side2;
      const F2 = Fs.side2;
      const tailDx = cfg.x + cfg.tailSplit * SCALE;
      const tailDw = (viewData.side2.w - cfg.tailSplit) * R.rTl * SCALE;
      const ty = GROUND_Y + 28;
      arrow(tailDx, ty, tailDx + tailDw, ty);
      ctx.textAlign = 'center';
      ctx.fillText(`TAIL LENGTH: ${proportions.tail.value} CM`, tailDx + tailDw / 2, ty + 16);
    }

    /* ================= legend / notes / title ================= */
    function drawLegend() {
      const x0 = 50, y0 = 758;
      ctx.font = 'bold 12px Arial, sans-serif';
      ctx.fillStyle = '#111827';
      ctx.textAlign = 'left';
      ctx.fillText('COLOUR SECTIONS:', x0, y0);
      const cols = 3, colW = 230, rowH = 30, sw = 22;
      REGION_KEYS.forEach((key, i) => {
        const col = i % cols, row = Math.floor(i / cols);
        const x = x0 + col * colW, y = y0 + 20 + row * rowH;
        ctx.fillStyle = state[key].color;
        ctx.fillRect(x, y, sw, sw);
        ctx.strokeStyle = '#111827';
        ctx.lineWidth = 1.2;
        ctx.strokeRect(x, y, sw, sw);
        ctx.fillStyle = '#111827';
        ctx.font = 'bold 9px Arial, sans-serif';
        ctx.fillText(regions[key].legend, x + sw + 6, y + 9);
        ctx.font = '8px Arial, sans-serif';
        ctx.fillStyle = '#374151';
        ctx.fillText(state[key].color.toUpperCase(), x + sw + 6, y + 19);
      });
    }

    function drawNotes() {
      const x0 = 700, y0 = 924;
      ctx.fillStyle = '#111827';
      ctx.textAlign = 'left';
      ctx.font = 'bold 11px Arial, sans-serif';
      ctx.fillText('NOTES:', x0, y0);
      ctx.font = '10px Arial, sans-serif';
      [
        '- FAUX FUR MATERIALS WITH FAUX FUR MATERIALS, INCLUDE FAUX STRIPS.',
        '- PADDING WETEY AND CONSTRUCTION MATERIAL 9BED ALD FOR, PADDING THE MALE COMP SIZE.',
        `- CONSTRUCTION BODY LENGTH: ${total()} CM   - CONSTRUCTION TAIL LENGTH: ${proportions.tail.value} CM`,
        '- HEAD/FJR AFTERNIIOJATR WE HEAD.'
      ].forEach((t, i) => ctx.fillText(t, x0, y0 + 14 + i * 13));
    }

    function drawTitleBox() {
      const x0 = 700, y0 = 760, w = 420, h = 150;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x0, y0, w, h);
      ctx.strokeStyle = '#111827';
      ctx.lineWidth = 2;
      ctx.strokeRect(x0, y0, w, h);
      ctx.fillStyle = '#111827';
      ctx.textAlign = 'center';
      ctx.font = 'bold 17px Arial, sans-serif';
      ctx.fillText(document.getElementById('input-title').value, x0 + w / 2, y0 + 34);
      ctx.font = '12px Arial, sans-serif';
      ctx.fillStyle = '#374151';
      ctx.fillText(`${total()} CM - MODEL: ${document.getElementById('input-model').value.toUpperCase()}`, x0 + w / 2, y0 + 56);
      ctx.strokeStyle = '#111827';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x0, y0 + 66); ctx.lineTo(x0 + w, y0 + 66); ctx.stroke();
      ctx.fillStyle = '#111827';
      ctx.textAlign = 'left';
      ctx.font = '11px Arial, sans-serif';
      ctx.fillText('TITLE:', x0 + 12, y0 + 96);
      ctx.fillText('DATE:', x0 + 12, y0 + 124);
      ctx.fillText('MODEL:', x0 + 300, y0 + 124);
      ctx.fillText(document.getElementById('input-date').value, x0 + 62, y0 + 124);
      ctx.textAlign = 'right';
      ctx.fillText(document.getElementById('input-model').value, x0 + w - 12, y0 + 124);
    }

    /* ================= main render ================= */
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = gridPat;
      ctx.fillRect(18, 18, 1104, 984);
      ctx.strokeStyle = '#9ca3af';
      ctx.lineWidth = 2;
      ctx.strokeRect(18, 18, 1104, 984);

      const Fs = {};
      for (const view of ['front', 'side1', 'side2']) Fs[view] = drawView(view);
      drawAnnotations(Fs);
      drawLegend();
      drawNotes();
      drawTitleBox();
    }

    /* ================= controls ================= */
    function buildControls() {
      const regionList = document.getElementById('region-list');
      REGION_KEYS.forEach(id => {
        const row = document.createElement('div');
        row.className = 'region';
        row.innerHTML = `
          <span class="region-name">${regions[id].label}</span>
          <input type="color" id="color-${id}" value="${regions[id].color}">
          <select class="pattern" id="pattern-${id}">
            ${Object.entries(patterns).map(([k, v]) => `<option value="${k}"${k === regions[id].pattern ? ' selected' : ''}>${v}</option>`).join('')}
          </select>`;
        regionList.appendChild(row);
      });
      REGION_KEYS.forEach(id => {
        document.getElementById(`color-${id}`).addEventListener('input', e => {
          state[id].color = e.target.value;
          quickDraw = true; invalidateRegion(id); requestRender();
        });
        document.getElementById(`color-${id}`).addEventListener('change', e => {
          state[id].color = e.target.value;
          quickDraw = false; invalidateRegion(id); requestRender();
        });
        document.getElementById(`pattern-${id}`).addEventListener('change', e => {
          state[id].pattern = e.target.value;
          invalidateRegion(id); requestRender();
        });
      });
      const propList = document.getElementById('proportion-list');
      Object.keys(proportions).forEach(id => {
        const p = proportions[id];
        const div = document.createElement('div');
        div.className = 'slider-row';
        div.innerHTML = `
          <label>${p.label}</label>
          <input type="range" id="prop-${id}" min="${p.min}" max="${p.max}" value="${p.value}">
          <input type="number" class="val" id="num-${id}" min="${p.min}" max="${p.max}" step="1" value="${p.value}">`;
        propList.appendChild(div);
        // slider -> number box -> sheet
        document.getElementById(`prop-${id}`).addEventListener('input', e => {
          setProp(id, parseInt(e.target.value));
        });
        // typing: live update while the value is in range
        document.getElementById(`num-${id}`).addEventListener('input', e => {
          const raw = e.target.value.trim();
          if (raw === '') return;                       // allow clearing the field mid-typing
          const v = parseInt(raw);
          if (isNaN(v) || v < p.min || v > p.max) return;   // out of range: clamp on blur/Enter instead
          setProp(id, v, false);
        });
        // blur / Enter: clamp into range and rewrite the field
        document.getElementById(`num-${id}`).addEventListener('change', e => {
          const v = parseInt(e.target.value);
          if (isNaN(v)) { syncPropField(id); return; }
          setProp(id, v, true);
        });
      });
    }

    function randomize() {
      const palette = ['#8A2BE2', '#d97706', '#7c3aed', '#ec4899', '#10b981', '#3b82f6', '#A9A9A9', '#FFFFFF', '#FFB6C1', '#4DB8FF', '#1E1E1E'];
      REGION_KEYS.forEach(id => {
        state[id].color = palette[Math.floor(Math.random() * palette.length)];
        const patKeys = Object.keys(patterns);
        state[id].pattern = patKeys[Math.floor(Math.random() * patKeys.length)];
        document.getElementById(`color-${id}`).value = state[id].color;
        document.getElementById(`pattern-${id}`).value = state[id].pattern;
      });
      quickDraw = false;
      clearTintCache(); requestRender();
    }

    /* 預設（清空）配色：所有分區一律白色 */
    const DEFAULT_COLOR = '#FFFFFF';
    const DEFAULT_PATTERN = 'solid';

    // src = null -> 全部套白色（預設）；src = regions -> 套回參考圖的 17 色
    function applyPalette(src) {
      REGION_KEYS.forEach(id => {
        const c = src ? src[id].color : DEFAULT_COLOR;
        const p = src ? src[id].pattern : DEFAULT_PATTERN;
        state[id].color = c;
        state[id].pattern = p;
        document.getElementById(`color-${id}`).value = c;
        document.getElementById(`pattern-${id}`).value = p;
      });
      quickDraw = false;
      clearTintCache(); requestRender();
    }

    function resetColors() { applyPalette(null); }
    function resetToReference() { applyPalette(regions); }

    /* ================= save & share link =================
       The whole design (17 colours + patterns + proportions + text fields) is
       packed into the URL hash, so "saving" only needs a link — no server. */
    function utf8ToB64(str) {
      return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (m, p) => String.fromCharCode('0x' + p)));
    }
    function b64ToUtf8(b64) {
      return decodeURIComponent(Array.prototype.map.call(atob(b64),
        c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    }
    function b64url(s) { return s.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
    function fromB64url(s) {
      s = s.replace(/-/g, '+').replace(/_/g, '/');
      while (s.length % 4) s += '=';
      return s;
    }

    function snapshot() {
      const c = {}, p = {}, pr = {};
      REGION_KEYS.forEach(k => { c[k] = state[k].color.replace('#', ''); p[k] = state[k].pattern; });
      Object.keys(proportions).forEach(k => pr[k] = proportions[k].value);
      return {
        c, p, pr,
        t: {
          title: document.getElementById('input-title').value,
          model: document.getElementById('input-model').value,
          date: document.getElementById('input-date').value
        }
      };
    }

    // A page opened inside an embedded preview has location "about:srcdoc" — not a usable URL.
    // Local preview servers (127.0.0.1 / localhost / static-html) also produce unshareable links.
    function usableBase() {
      const ok = u => /^(https?:|file:)/i.test(u || '');
      const reliable = u => {
        if (!u) return false;
        if (/^(about|blob|data|javascript|mailto|sms|tel):/i.test(u)) return false;
        try {
          const url = new URL(u);
          if (/^127\.0\.0\.1$|^localhost$/i.test(url.hostname)) return false;
          if (url.pathname.includes('/static-html/')) return false;
        } catch (e) { return false; }
        return true;
      };
      let base = '';
      try { if (ok(location.href) && reliable(location.href)) base = location.href.split('#')[0]; } catch (e) {}
      if (!base) try { if (ok(document.baseURI) && reliable(document.baseURI)) base = document.baseURI.split('#')[0]; } catch (e) {}
      return base;
    }

    function linkPayload() {
      return '#d=' + b64url(utf8ToB64(JSON.stringify(snapshot())));
    }

    function buildLink() {
      const payload = linkPayload();
      const base = usableBase();
      return base ? { ok: true, link: base + payload, payload } : { ok: false, link: '', payload };
    }

    function loadFromHash() {
      const m = location.hash.match(/[#&]d=([A-Za-z0-9\-_]+)/);
      if (!m) return null;
      try { return JSON.parse(b64ToUtf8(fromB64url(m[1]))); } catch (e) { return null; }
    }

    function applySnapshot(o) {
      if (!o) return false;
      REGION_KEYS.forEach(k => {
        if (o.c && o.c[k]) state[k].color = ('#' + o.c[k]).slice(0, 7);
        if (o.p && o.p[k] && patterns[o.p[k]]) state[k].pattern = o.p[k];
      });
      if (o.pr) Object.keys(proportions).forEach(k => {
        if (o.pr[k] != null) proportions[k].value = parseInt(o.pr[k]) || proportions[k].value;
      });
      if (o.t) {
        if (o.t.title != null) document.getElementById('input-title').value = o.t.title;
        if (o.t.model != null) document.getElementById('input-model').value = o.t.model;
        if (o.t.date != null) document.getElementById('input-date').value = o.t.date;
      }
      return true;
    }

    /* ================= proportions (slider <-> typed number <-> sheet) ================= */
    function clampProp(id, v) {
      const p = proportions[id];
      if (isNaN(v)) return p.value;
      return Math.max(p.min, Math.min(p.max, Math.round(v)));
    }
    function syncPropField(id) {
      const num = document.getElementById(`num-${id}`);
      if (num) num.value = proportions[id].value;
    }
    // rewriteNum=false while the user is typing in the number box (keeps the caret put)
    function setProp(id, v, rewriteNum = true) {
      const p = proportions[id];
      p.value = clampProp(id, v);
      document.getElementById(`prop-${id}`).value = p.value;
      const num = document.getElementById(`num-${id}`);
      if (num && (rewriteNum || num.value.trim() !== String(p.value))) num.value = p.value;
      requestRender();
    }

    function syncControls() {
      REGION_KEYS.forEach(id => {
        document.getElementById(`color-${id}`).value = state[id].color;
        document.getElementById(`pattern-${id}`).value = state[id].pattern;
      });
      Object.keys(proportions).forEach(id => {
        document.getElementById(`prop-${id}`).value = proportions[id].value;
        const num = document.getElementById(`num-${id}`);
        if (num) num.value = proportions[id].value;
      });
    }

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => t.classList.add('hidden'), 2400);
    }

    function legacyCopy(text) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        ta.setSelectionRange(0, text.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return !!ok;
      } catch (e) { return false; }
    }

    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text).then(() => true, () => legacyCopy(text));
      }
      return Promise.resolve(legacyCopy(text));
    }

    // last resort: the text is selected, tell the user to press Ctrl/Cmd+C
    function copyFallback() {
      const inp = document.getElementById('link-out');
      inp.focus();
      inp.select();
      try { inp.setSelectionRange(0, inp.value.length); } catch (e) {}
      toast('已全選 — 請按 Ctrl+C（Mac: ⌘+C）複製');
    }

    function reportCopy(ok) {
      if (ok) toast('連結已複製 Link copied!');
      else copyFallback();
    }

    function openLinkModal() {
      const r = buildLink();
      const inp = document.getElementById('link-out');
      const warn = document.getElementById('link-warn');
      const note = document.getElementById('link-note');
      const openBtn = document.getElementById('link-open');
      if (r.ok) {
        inp.value = r.link;
        warn.classList.add('hidden');
        openBtn.classList.remove('hidden');
        note.textContent = '這個連結包含全部 17 區顏色、花紋、比例與標題資料。任何人開啟它都會看到這份配色。';
      } else {
        inp.value = r.payload;
        warn.textContent = '目前是在內嵌預覽或本機預覽伺服器（about:srcdoc / 127.0.0.1 / static-html）裡執行，這個網址別人無法開啟。請先複製下方的 #d=… 資料碼，再用瀏覽器直接開啟 furry-suit-designer.html，把資料碼貼在檔案網址後面：…furry-suit-designer.html' + r.payload.slice(0, 30) + '…';
        warn.classList.remove('hidden');
        openBtn.classList.add('hidden');
        note.textContent = '若想讓別人也能開這個連結，可以把 HTML 檔傳給對方，或把它發佈成網址後再存一次。';
      }
      document.getElementById('link-modal').classList.remove('hidden');
      inp.focus(); inp.select();
      copyText(inp.value).then(reportCopy);
    }

    /* ================= init ================= */
    async function init() {
      gridPat = gridPattern();
      const views = ['front', 'side1', 'side2'];
      await Promise.all(views.map(async v => {
        const a = ASSETS.views[v];
        const [linesImg, regionsImg] = await Promise.all([loadImage(a.lines), loadImage(a.regions)]);
        const dec = decodeRegions(v, regionsImg, a.w, a.h);
        viewData[v] = {
          w: a.w, h: a.h,
          linesImg,
          regionAlpha: dec.alpha,
          hasRegion: dec.has
        };
      }));
      buildControls();
      document.getElementById('input-title').addEventListener('input', requestRender);
      document.getElementById('input-model').addEventListener('input', requestRender);
      document.getElementById('input-date').addEventListener('input', requestRender);
      document.getElementById('btn-random').addEventListener('click', randomize);
      document.getElementById('btn-default').addEventListener('click', resetColors);
      document.getElementById('btn-reference').addEventListener('click', resetToReference);
      document.getElementById('btn-save').addEventListener('click', openLinkModal);
      document.getElementById('link-copy').addEventListener('click', () => {
        const inp = document.getElementById('link-out');
        inp.focus(); inp.select();
        try { inp.setSelectionRange(0, inp.value.length); } catch (e) {}
        copyText(inp.value).then(reportCopy);
      });
      document.getElementById('link-open').addEventListener('click', () => {
        const r = buildLink();
        if (r.ok) window.open(r.link, '_blank');
        else toast('內嵌預覽無法產生網址，請直接用瀏覽器開啟 HTML 檔');
      });
      document.getElementById('link-close').addEventListener('click', () => {
        document.getElementById('link-modal').classList.add('hidden');
      });
      document.getElementById('input-date').value = new Date().toISOString().split('T')[0];
      const snap = loadFromHash();
      if (applySnapshot(snap)) { syncControls(); clearTintCache(); requestRender(); }
      else applyPalette(null);   // 起始狀態 = 預設：所有分區白色（線稿可見、尚未上色）
    }
    init();
  </script>
</body>
</html>
